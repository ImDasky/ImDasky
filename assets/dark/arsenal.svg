<svg viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arsenal — technical toolset and methodology">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s} .a5{animation-delay:.9s} .a6{animation-delay:1.1s}
    @media (prefers-reduced-motion: reduce) { .rise,.draw { animation: none; opacity: 1; stroke-dashoffset: 0; } }
  </style>

  <!-- title -->
  <text x="30" y="28" class="mono rise a1" fill="#777777" font-size="11" letter-spacing="2">ARSENAL — THE TOOLS BEHIND THE RESEARCH</text>
  <text x="930" y="28" class="mono rise a1" fill="#666666" font-size="10" text-anchor="end" letter-spacing="1">FIG. 01</text>

  <!-- central node -->
  <rect x="380" y="60" width="240" height="50" rx="4" fill="none" stroke="#444444" stroke-width="1.5" class="rise a2"/>
  <text x="500" y="82" class="mono rise a2" fill="#DDDDDD" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">BEN.SYS</text>
  <text x="500" y="98" class="mono rise a2" fill="#777777" font-size="9" text-anchor="middle" letter-spacing="1">security research pipeline</text>

  <!-- connecting lines from center -->
  <line x1="420" y1="110" x2="180" y2="170" stroke="#444444" stroke-width="1" class="draw a3"/>
  <line x1="500" y1="110" x2="500" y2="170" stroke="#444444" stroke-width="1" class="draw a3"/>
  <line x1="580" y1="110" x2="820" y2="170" stroke="#444444" stroke-width="1" class="draw a3"/>

  <!-- LEFT NODE: Traffic & Protocol Analysis -->
  <rect x="60" y="170" width="240" height="44" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a3"/>
  <text x="180" y="190" class="mono rise a3" fill="#DDDDDD" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">TRAFFIC &amp; PROTOCOLS</text>
  <text x="180" y="205" class="mono rise a3" fill="#777777" font-size="9" text-anchor="middle" letter-spacing="1">interception · protobuf · har</text>
  <!-- sub-nodes -->
  <line x1="120" y1="214" x2="80" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <line x1="180" y1="214" x2="180" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <line x1="240" y1="214" x2="280" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <rect x="20" y="250" width="100" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="70" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">SURGE / HAR</text>
  <rect x="130" y="250" width="100" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="180" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">PROTOBUF</text>
  <rect x="240" y="250" width="90" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="285" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">CURL / DEVTOOLS</text>

  <!-- CENTER NODE: Static & Dynamic RE -->
  <rect x="380" y="170" width="240" height="44" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a3"/>
  <text x="500" y="190" class="mono rise a3" fill="#DDDDDD" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">BINARY &amp; RUNTIME RE</text>
  <text x="500" y="205" class="mono rise a3" fill="#777777" font-size="9" text-anchor="middle" letter-spacing="1">disassembly · hooks · il2cpp</text>
  <!-- sub-nodes -->
  <line x1="440" y1="214" x2="380" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <line x1="500" y1="214" x2="500" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <line x1="560" y1="214" x2="620" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <rect x="330" y="250" width="100" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="380" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">HOPPER</text>
  <rect x="445" y="250" width="110" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="500" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">IL2CPP DUMPER</text>
  <rect x="570" y="250" width="100" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="620" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">FRIDA / HOOKS</text>

  <!-- RIGHT NODE: Payload & Automation -->
  <rect x="700" y="170" width="240" height="44" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a3"/>
  <text x="820" y="190" class="mono rise a3" fill="#DDDDDD" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">PAYLOADS &amp; SCRIPTING</text>
  <text x="820" y="205" class="mono rise a3" fill="#777777" font-size="9" text-anchor="middle" letter-spacing="1">xss · webview · scanners</text>
  <!-- sub-nodes -->
  <line x1="760" y1="214" x2="730" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <line x1="820" y1="214" x2="820" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <line x1="880" y1="214" x2="910" y2="250" stroke="#444444" stroke-width="1" class="draw a4"/>
  <rect x="680" y="250" width="100" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="730" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">PYTHON SCRIPTS</text>
  <rect x="790" y="250" width="70" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="825" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">JS / SVG</text>
  <rect x="870" y="250" width="110" height="32" rx="3" fill="none" stroke="#444444" stroke-width="1" class="rise a4"/>
  <text x="925" y="270" class="mono rise a4" fill="#AAAAAA" font-size="10" text-anchor="middle" letter-spacing="1">DECRYPTED IPAS</text>

  <!-- bottom section: Languages -->
  <line x1="30" y1="320" x2="970" y2="320" stroke="#444444" stroke-width="1" class="draw a5"/>
  <text x="30" y="350" class="mono rise a5" fill="#777777" font-size="11" letter-spacing="2">LANGUAGES &amp; ARTIFACTS</text>
  <text x="30" y="375" class="mono rise a5" fill="#AAAAAA" font-size="12" letter-spacing="1">Python · JavaScript · HTML/SVG · C/C++ · ARM Assembly · dump.cs · global-metadata.dat</text>

  <text x="30" y="410" class="mono rise a6" fill="#777777" font-size="11" letter-spacing="2">DOMAINS &amp; TARGETS</text>
  <text x="30" y="435" class="mono rise a6" fill="#AAAAAA" font-size="12" letter-spacing="1">iOS Applications · Unity / IL2CPP Games · WebViews · Authenticated APIs</text>

  <text x="500" y="410" class="mono rise a6" fill="#777777" font-size="11" letter-spacing="2">RESEARCH VECTORS</text>
  <text x="500" y="435" class="mono rise a6" fill="#AAAAAA" font-size="12" letter-spacing="1">DOM Sinks &amp; XSS · Request Rewriting · Signatures/Salts Extraction · Protobuf Schemas</text>

  <!-- bottom label -->
  <text x="500" y="470" class="mono rise a6" fill="#666666" font-size="10" text-anchor="middle" letter-spacing="2">DASHED LINES · DATA IN MOTION</text>
</svg>

<svg viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ben Shi — Security Researcher &amp; Reverse Engineer">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s}
    
    /* Clean Rotating Text Animation with Discrete Step Transitions */
    .rot { opacity: 0; animation: rot 12s infinite; }
    .r1 { animation-delay: 0s; }
    .r2 { animation-delay: 4s; }
    .r3 { animation-delay: 8s; }
    @keyframes rot {
      0% { opacity: 0; transform: translateY(4px); }
      5% { opacity: 1; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(0); }
      35% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .draw,.rise,.fade,.rot { animation: none; opacity: 1; } }
  </style>

  <!-- top label -->
  <text x="30" y="38" class="mono fade a1" fill="#777777" font-size="11" letter-spacing="2">PORTFOLIO · INDEX Nº 001</text>

  <!-- horizontal rule -->
  <line x1="30" y1="54" x2="970" y2="54" class="draw" stroke="#444444" stroke-width="1"/>

  <!-- main name -->
  <text x="30" y="130" class="mono rise a2" fill="#DDDDDD" font-size="64" font-weight="700" letter-spacing="-1">Ben Shi</text>

  <!-- subtitle -->
  <text x="30" y="165" class="mono rise a3" fill="#AAAAAA" font-size="16" letter-spacing="1">Mobile Security Researcher &amp; Reverse Engineer</text>

  <!-- focus tags -->
  <text x="30" y="205" class="mono fade a4" fill="#777777" font-size="11" letter-spacing="2">FOCUS · iOS RE · NETWORK TRAFFIC · IL2CPP · WEBVIEW EXPLOITATION</text>
  <text x="30" y="226" class="mono fade a4" fill="#666666" font-size="11" letter-spacing="2">OPEN TO FREELANCE · COLLABORATION · RESPONSIBLE DISCLOSURE</text>

  <!-- column headers rule -->
  <line x1="30" y1="250" x2="970" y2="250" class="draw" stroke="#444444" stroke-width="1"/>
  <text x="30" y="274" class="mono fade a5" fill="#777777" font-size="11" letter-spacing="3">REVERSE ENGINEERING</text>
  <text x="360" y="274" class="mono fade a5" fill="#777777" font-size="11" letter-spacing="3">TRAFFIC &amp; PROTOCOLS</text>
  <text x="700" y="274" class="mono fade a5" fill="#777777" font-size="11" letter-spacing="3">AUTOMATION &amp; PAYLOADS</text>

  <!-- rotating status line -->
  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="500" y="325" text-anchor="middle" class="rot r1" fill="#AAAAAA">SURGE · HAR CAPTURES · PROTOBUF REWRITING · API DISCOVERY</text>
    <text x="500" y="325" text-anchor="middle" class="rot r2" fill="#AAAAAA">HOPPER DISASSEMBLER · FRIDA HOOKS · IL2CPP DUMPER · GHIDRA</text>
    <text x="500" y="325" text-anchor="middle" class="rot r3" fill="#AAAAAA">PYTHON AUTOMATION · DOM SINKS · JS &amp; SVG PAYLOADS · DECRYPTED IPAS</text>
  </g>

  <!-- bottom rule -->
  <line x1="30" y1="345" x2="970" y2="345" class="draw" stroke="#444444" stroke-width="1"/>
</svg>

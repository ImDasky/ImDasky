<svg viewBox="0 0 1000 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 06 — STACK">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: #444444; stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw,.f { animation: none; opacity: 1; } }
  </style>
  <text x="30" y="45" class="mono f" fill="#DDDDDD" font-size="28" font-weight="700" letter-spacing="6">06</text>
  <text x="90" y="45" class="mono f" fill="#777777" font-size="28" font-weight="400" letter-spacing="6">S T A C K</text>
  <line x1="340" y1="38" x2="920" y2="38" class="draw"/>
  <text x="930" y="45" class="mono f" fill="#666666" font-size="10" text-anchor="end" letter-spacing="1">~/06-stack</text>
</svg>

<svg viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, tools">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <!-- bio paragraph -->
  <text x="30" y="30" class="mono rise a1" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    Vulnerability researcher specializing in iOS binary reverse engineering,
  </text>
  <text x="30" y="50" class="mono rise a1" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    mobile application security, and API business logic flaws.
  </text>
  <text x="30" y="75" class="mono rise a2" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    Leveraging deep internal system knowledge and runtime instrumentation
  </text>
  <text x="30" y="95" class="mono rise a2" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    to analyze client boundaries and uncover high-impact vulnerabilities.
  </text>

  <!-- labels -->
  <text x="30" y="140" class="mono rise a3" fill="#777777" font-size="11" letter-spacing="2">FOCUS</text>
  <text x="160" y="140" class="mono rise a3" fill="#AAAAAA" font-size="11" letter-spacing="1">iOS Security · API Exploitation · Binary Reverse Engineering · Web App Security</text>

  <text x="30" y="165" class="mono rise a4" fill="#777777" font-size="11" letter-spacing="2">STATUS</text>
  <text x="160" y="165" class="mono rise a4" fill="#AAAAAA" font-size="11" letter-spacing="1">open to freelance · collaboration · responsible disclosure</text>

  <text x="30" y="190" class="mono rise a5" fill="#777777" font-size="11" letter-spacing="2">TOOLS</text>
  <text x="160" y="190" class="mono rise a5" fill="#AAAAAA" font-size="11" letter-spacing="1">Hopper · Frida · class-dump · LLDB · Surge · Burp Suite · Custom Python</text>
</svg>

<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, tools">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text x="30" y="30" class="mono rise a1" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    Security researcher focused on mobile-app reverse engineering and
  </text>
  <text x="30" y="50" class="mono rise a1" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    network-traffic analysis. Combines static binary disassembly, runtime
  </text>
  <text x="30" y="70" class="mono rise a2" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    instrumentation, and traffic interception to map attack surfaces and
  </text>
  <text x="30" y="90" class="mono rise a2" fill="#DDDDDD" font-size="13" letter-spacing="0.5">
    uncover high-impact vulnerabilities in iOS apps and Unity/IL2CPP targets.
  </text>

  <text x="30" y="135" class="mono rise a3" fill="#777777" font-size="11" letter-spacing="2">FOCUS</text>
  <text x="160" y="135" class="mono rise a3" fill="#AAAAAA" font-size="11" letter-spacing="1">iOS RE · API Traffic Analysis · XSS &amp; WebView Exploitation · IL2CPP · Protobuf</text>

  <text x="30" y="160" class="mono rise a4" fill="#777777" font-size="11" letter-spacing="2">STATUS</text>
  <text x="160" y="160" class="mono rise a4" fill="#AAAAAA" font-size="11" letter-spacing="1">open to freelance · collaboration · responsible disclosure</text>

  <text x="30" y="185" class="mono rise a5" fill="#777777" font-size="11" letter-spacing="2">PRIMARY</text>
  <text x="160" y="185" class="mono rise a5" fill="#AAAAAA" font-size="11" letter-spacing="1">Surge · Hopper · Frida · Python Scripts · IL2CppDumper · JS/SVG Payloads</text>

  <text x="30" y="210" class="mono rise a6" fill="#777777" font-size="11" letter-spacing="2">SUPPORT</text>
  <text x="160" y="210" class="mono rise a6" fill="#AAAAAA" font-size="11" letter-spacing="1">curl · Filza · Decrypted IPAs · Protobuf Inspection · Browser DevTools</text>
</svg>

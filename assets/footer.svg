<svg viewBox="0 0 1000 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current status footer">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .fade { opacity: 0; animation: fade .8s ease .3s forwards; }
    @keyframes fade { to { opacity: 1; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    @media (prefers-reduced-motion: reduce) { .draw,.fade,.pulse { animation: none; opacity: 1; } }
  </style>

  <line x1="30" y1="20" x2="970" y2="20" class="draw" stroke="#C0C0C0" stroke-width="1"/>

  <circle cx="44" cy="52" r="4" fill="#555555" class="pulse"/>
  <text x="60" y="56" class="mono fade" fill="#888888" font-size="11" letter-spacing="1">CURRENTLY RESEARCHING · BUILDING · BREAKING THINGS</text>

  <text x="970" y="56" class="mono fade" fill="#AAAAAA" font-size="10" text-anchor="end" letter-spacing="1">all research conducted under responsible disclosure</text>

  <line x1="30" y1="80" x2="970" y2="80" class="draw" stroke="#C0C0C0" stroke-width="1"/>
</svg>

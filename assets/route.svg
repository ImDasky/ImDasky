  <text x="80.0" y="183" class="mono m" style="animation-delay:0.65s" fill="#AAAAAA" font-size="9" text-anchor="middle" letter-spacing="0.5">Music-Player</text>
  <text x="80.0" y="199" class="mono m" style="animation-delay:0.7s" fill="#AAAAAA" font-size="9" text-anchor="middle" letter-spacing="0.5">PokecenterOverlay</text>
  <text x="80.0" y="215" class="mono m" style="animation-delay:0.75s" fill="#AAAAAA" font-size="9" text-anchor="middle" letter-spacing="0.5">ChatGPTpatcher</text>

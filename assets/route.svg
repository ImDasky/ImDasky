  <circle cx="1100" cy="125" r="5" fill="none" stroke="#CCCCCC" stroke-width="1" opacity="0.5" class="pulse"/>
  <text x="1100" y="149" class="mono m pulse" fill="#888888" font-size="11" text-anchor="middle" font-weight="700">NOW</text>
  <text x="1100" y="109" class="mono m" style="animation-delay:2.5s" fill="#555555" font-size="10" text-anchor="middle">11 repos</text>

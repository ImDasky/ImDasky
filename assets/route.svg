  <line x1="1060.0" y1="117" x2="1060.0" y2="133" stroke="#C0C0C0" stroke-width="1"/>
  <circle cx="1060.0" cy="125" r="4" fill="#555555" class="m" style="animation-delay:0.8999999999999999s"/>
  <text x="1060.0" y="105" class="mono m" style="animation-delay:0.8999999999999999s" fill="#555555" font-size="10" text-anchor="middle" letter-spacing="1">3 repos</text>
  <text x="1060.0" y="167" class="mono m" style="animation-delay:0.8999999999999999s" fill="#AAAAAA" font-size="9" text-anchor="middle" letter-spacing="0.5">inkshelf</text>

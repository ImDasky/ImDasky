<svg viewBox="0 0 1200 314" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline of 11 public repositories">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    @media (prefers-reduced-motion: reduce) { .axis,.m,.pulse { animation: none; opacity: 1; } }
  </style>
  <text x="80" y="28" class="mono m" style="animation-delay:.1s" fill="#888888" font-size="11" letter-spacing="2">THE ROUTE SO FAR</text>

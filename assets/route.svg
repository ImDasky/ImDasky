  <line x1="80" y1="125" x2="1100" y2="125" class="axis" stroke="#C0C0C0" stroke-width="1"/>
  <text x="80.0" y="149" class="mono m" style="animation-delay:0.6s" fill="#888888" font-size="12" text-anchor="middle" font-weight="700">2025</text>
  <line x1="80.0" y1="117" x2="80.0" y2="133" stroke="#C0C0C0" stroke-width="1"/>
